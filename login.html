<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Ingresar | FASTEC</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="lg-body">
<div class="lg-wrap">
  <a class="lg-logo" href="productos.html" title="Ir a la tienda"><img src="img/logo3.png" alt="FASTEC"></a>
  <div class="lg-tabs" role="tablist">
    <button type="button" class="on" data-m="in" role="tab">Ingresar</button>
    <button type="button" data-m="up" role="tab">Crear cuenta</button>
  </div>
  <div id="lgInfo" class="lg-info" hidden></div>
  <div id="lgError" class="lg-error" hidden role="alert"></div>
  <div id="lgOk" class="lg-ok" hidden role="status"></div>
  <form id="lgForm" class="lg-card" autocomplete="on">
    <label for="lgUser">Correo electrónico</label>
    <input id="lgUser" type="email" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="lgPass">Contraseña</label>
    <div class="lg-pass">
      <input id="lgPass" type="password" autocomplete="current-password" required minlength="6">
      <button type="button" id="lgEye" aria-label="Mostrar contraseña">👁</button>
    </div>
    <div id="lgConfWrap" hidden>
      <label for="lgPass2">Repetir contraseña</label>
      <input id="lgPass2" type="password" autocomplete="new-password" minlength="8">
    </div>
    <div class="lg-row">
      <label><input type="checkbox" id="lgRemember"> Recuérdame</label>
      <button class="ad-btn" id="lgBtn" type="submit">Ingresar</button>
    </div>
  </form>
  <p class="lg-links"><a href="productos.html">← Volver a la tienda</a></p>
</div>
<script src="js/store.js"></script>
<script src="js/config.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id), C = window.FASTEC_CONFIG || {}, KEY = 'fastec_fail', MAX = 5, LOCK = 10;
  const q = new URLSearchParams(location.search);
  // solo se permite volver a páginas del propio sitio (evita redirecciones a otros dominios)
  const next = /^[a-z0-9_-]+\.html$/i.test(q.get('next') || '') ? q.get('next') : '';
  let mode = 'in';

  const hide = () => ['lgError', 'lgOk'].forEach(i => $(i).hidden = true);
  const showErr = m => { hide(); $('lgError').innerHTML = m; $('lgError').hidden = false; };
  const showOk = m => { hide(); $('lgOk').innerHTML = m; $('lgOk').hidden = false; };
  const state = () => { try{ return JSON.parse(localStorage.getItem(KEY) || '{"n":0,"until":0}'); }catch(e){ return {n:0, until:0}; } };
  const need = {whatsapp: 'consultar por WhatsApp', cart: 'usar el carrito', fav: 'guardar favoritos'}[q.get('need')];
  if(need){ $('lgInfo').textContent = 'Inicia sesión o crea tu cuenta para ' + need + '.'; $('lgInfo').hidden = false; }

  function setMode(m){
    mode = m; hide();
    document.querySelectorAll('.lg-tabs button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
    $('lgConfWrap').hidden = m === 'in'; $('lgPass2').required = m === 'up';
    $('lgPass').autocomplete = m === 'in' ? 'current-password' : 'new-password';
    $('lgBtn').textContent = m === 'in' ? 'Ingresar' : 'Crear cuenta';
  }
  document.querySelectorAll('.lg-tabs button').forEach(b => b.onclick = () => setMode(b.dataset.m));
  $('lgEye').onclick = () => { const p = $('lgPass'); p.type = p.type === 'password' ? 'text' : 'password'; };
  if(q.get('mode') === 'up') setMode('up');
  if(!C.supabaseUrl || !C.supabaseAnonKey){ showErr('<strong>Falta configurar Supabase</strong> en js/config.js.'); $('lgBtn').disabled = true; }

  // si ya tiene sesión, no vuelve a pedirla; el rol se confirma en el servidor (por si lo hicieron admin después de entrar)
  const ses = fastecSession();
  if(ses){
    (async () => {
      let role = ses.role;
      try{ role = await fastecVerifyRole(); }catch(e){}
      location.replace(role === 'admin' ? (next || 'admin.html') : (next || 'productos.html'));
    })();
    return;
  }

  async function api(path, opts){
    const r = await fetch(C.supabaseUrl + path, Object.assign({}, opts, {headers: Object.assign({apikey: C.supabaseAnonKey, 'Content-Type': 'application/json'}, (opts || {}).headers)}));
    return {ok: r.ok, status: r.status, body: await r.json().catch(() => ({}))};
  }
  async function enter(email, tok){
    // ¿Es administrador? La base solo devuelve su fila si está en la tabla "admins" (regla RLS).
    // Si la consulta falla NO se asume "cliente": se avisa, para que un admin no entre sin permisos sin enterarse.
    let a;
    for(let i = 0; i < 2; i++){
      a = await api('/rest/v1/admins?select=user_id', {headers: {Authorization: 'Bearer ' + tok.access_token}});
      if(a.ok && Array.isArray(a.body)) break;
      await new Promise(r => setTimeout(r, 400));
    }
    if(!(a.ok && Array.isArray(a.body))){
      showErr('<strong>No pudimos verificar tu tipo de cuenta</strong> (error ' + a.status + '). Inténtalo de nuevo. Si eres administrador, revisa que se ejecutó <code>supabase/permisos.sql</code> en Supabase.');
      return false;
    }
    const admin = a.body.length > 0;
    localStorage.removeItem(KEY);
    fastecSetSession(email, $('lgRemember').checked, 8, 7, {at: tok.access_token, rt: tok.refresh_token}, admin ? 'admin' : 'user');
    location.replace(admin ? (next || 'admin.html') : (next || 'productos.html'));
    return true;
  }

  $('lgForm').addEventListener('submit', async e => {
    e.preventDefault();
    const st = state(), email = $('lgUser').value.trim(), pass = $('lgPass').value;
    if(mode === 'in' && st.until > Date.now()){ showErr('<strong>Acceso bloqueado.</strong> Inténtalo de nuevo en ' + Math.ceil((st.until - Date.now())/60000) + ' min.'); return; }
    if(!/^\S+@\S+\.\S+$/.test(email)){ showErr('<strong>Error:</strong> escribe un correo válido.'); return; }
    if(pass.length < (mode === 'up' ? 8 : 6)){ showErr('<strong>Error:</strong> la contraseña debe tener al menos ' + (mode === 'up' ? 8 : 6) + ' caracteres.'); return; }
    if(mode === 'up' && pass !== $('lgPass2').value){ showErr('<strong>Error:</strong> las contraseñas no coinciden.'); return; }
    $('lgBtn').disabled = true; hide();
    try{
      if(mode === 'up'){
        const r = await api('/auth/v1/signup', {method:'POST', body: JSON.stringify({email, password: pass})});
        if(!r.ok){
          const m = String(r.body.msg || r.body.error_description || r.body.message || '').toLowerCase();
          showErr(m.includes('already') || m.includes('registered') ? 'Ese correo ya tiene una cuenta. Usa <strong>Ingresar</strong>.'
            : r.status === 429 ? 'Demasiados intentos. Espera unos minutos.' : '<strong>No se pudo crear la cuenta.</strong> Revisa los datos e inténtalo de nuevo.');
        } else if(r.body.access_token){ if(await enter(email, r.body)) return; }   // sin confirmación por correo: entra directo
        else if(Array.isArray(r.body.identities) && r.body.identities.length === 0){ showErr('Ese correo ya tiene una cuenta. Usa <strong>Ingresar</strong>.'); }   // Supabase no da error si ya existe
        else { showOk('<strong>Cuenta creada.</strong> Te enviamos un correo para confirmarla; luego vuelve aquí y pulsa <strong>Ingresar</strong>.'); setMode('in'); $('lgOk').hidden = false; }
      } else {
        const t = await api('/auth/v1/token?grant_type=password', {method:'POST', body: JSON.stringify({email, password: pass})});
        if(!t.ok){
          const unconfirmed = String(t.body.error_code || t.body.msg || '').toLowerCase().includes('confirm');
          if(unconfirmed) showErr('Falta confirmar tu correo. Revisa tu bandeja de entrada.');
          else {
            st.n++;
            if(st.n >= MAX){ st.until = Date.now() + LOCK*60000; st.n = 0; showErr('<strong>Acceso bloqueado</strong> por ' + LOCK + ' minutos tras varios intentos fallidos.'); }
            else showErr('<strong>Error:</strong> correo o contraseña incorrectos. Intentos restantes: ' + (MAX - st.n) + '.');
            localStorage.setItem(KEY, JSON.stringify(st));
          }
          $('lgPass').value = ''; $('lgPass').focus();
        } else { if(await enter(email, t.body)) return; }
      }
    }catch(err){ showErr('<strong>Error de conexión.</strong> Revisa tu internet e inténtalo otra vez.'); }
    setTimeout(() => $('lgBtn').disabled = false, 700);
  });
})();
</script>
</body>
</html>
