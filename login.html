<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Acceso administrativo | FASTEC</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="lg-body">
<div class="lg-wrap">
  <a class="lg-logo" href="productos.html" title="Ir al sitio"><img src="img/logo3.png" alt="FASTEC"></a>
  <div id="lgError" class="lg-error" hidden role="alert"></div>
  <form id="lgForm" class="lg-card" autocomplete="on">
    <label for="lgUser">Correo electrónico</label>
    <input id="lgUser" type="email" autocomplete="username" autocapitalize="none" required autofocus>
    <label for="lgPass">Contraseña</label>
    <div class="lg-pass">
      <input id="lgPass" type="password" autocomplete="current-password" required>
      <button type="button" id="lgEye" aria-label="Mostrar contraseña">👁</button>
    </div>
    <div class="lg-row">
      <label><input type="checkbox" id="lgRemember"> Recuérdame</label>
      <button class="ad-btn" id="lgBtn" type="submit">Acceder</button>
    </div>
  </form>
  <p class="lg-links" style="opacity:.8">Acceso exclusivo para administradores.</p>
  <p class="lg-links"><a href="productos.html">← Ir a FASTEC</a></p>
</div>
<script src="js/store.js"></script>
<script src="js/config.js"></script>
<script>
(function(){
  if(fastecIsAdmin()){ location.replace('admin.html'); return; }
  const $ = id => document.getElementById(id), C = window.FASTEC_CONFIG || {}, KEY = 'fastec_fail', MAX = 5, LOCK = 10;
  const showErr = m => { $('lgError').innerHTML = m; $('lgError').hidden = false; };
  const state = () => { try{ return JSON.parse(localStorage.getItem(KEY) || '{"n":0,"until":0}'); }catch(e){ return {n:0, until:0}; } };
  $('lgEye').onclick = () => { const p = $('lgPass'); p.type = p.type === 'password' ? 'text' : 'password'; };
  if(!C.supabaseUrl || !C.supabaseAnonKey){ showErr('<strong>Falta configurar Supabase</strong> en js/config.js.'); $('lgBtn').disabled = true; }

  async function api(path, opts){
    const r = await fetch(C.supabaseUrl + path, Object.assign({}, opts, {headers: Object.assign({apikey: C.supabaseAnonKey, 'Content-Type': 'application/json'}, (opts||{}).headers)}));
    return {ok: r.ok, status: r.status, body: await r.json().catch(() => ({}))};
  }
  $('lgForm').addEventListener('submit', async e => {
    e.preventDefault();
    const st = state();
    if(st.until > Date.now()){ showErr('<strong>Acceso bloqueado.</strong> Inténtalo de nuevo en ' + Math.ceil((st.until - Date.now())/60000) + ' min.'); return; }
    const email = $('lgUser').value.trim(), pass = $('lgPass').value;
    if(!/^\S+@\S+\.\S+$/.test(email)){ showErr('<strong>Error:</strong> escribe un correo válido.'); return; }
    if(pass.length < 6){ showErr('<strong>Error:</strong> la contraseña debe tener al menos 6 caracteres.'); return; }
    $('lgBtn').disabled = true; $('lgError').hidden = true;
    try{
      const t = await api('/auth/v1/token?grant_type=password', {method:'POST', body: JSON.stringify({email, password: pass})});
      if(!t.ok){
        st.n++;
        if(st.n >= MAX){ st.until = Date.now() + LOCK*60000; st.n = 0; showErr('<strong>Acceso bloqueado</strong> por ' + LOCK + ' minutos tras varios intentos fallidos.'); }
        else showErr('<strong>Error:</strong> correo o contraseña incorrectos. Intentos restantes: ' + (MAX - st.n) + '.');
        localStorage.setItem(KEY, JSON.stringify(st)); $('lgPass').value = ''; $('lgPass').focus();
      } else {
        // ¿Es administrador? La base solo devuelve su fila si está en la tabla "admins" (regla RLS).
        const a = await api('/rest/v1/admins?select=user_id', {headers: {Authorization: 'Bearer ' + t.body.access_token}});
        if(!a.ok || !Array.isArray(a.body) || !a.body.length){
          if(!a.ok) showErr('<strong>No se pudo verificar el permiso</strong> (código ' + a.status + '): ' + ((a.body && (a.body.message || a.body.msg)) || 'error del servidor') + '. Ejecuta supabase/permisos.sql en Supabase.');
          else showErr('<strong>Sin permiso:</strong> esta cuenta no es administradora de FASTEC.');
        } else {
          localStorage.removeItem(KEY);
          fastecSetSession(email, $('lgRemember').checked, 8, 7, {at: t.body.access_token, rt: t.body.refresh_token});
          location.replace('admin.html'); return;
        }
      }
    }catch(err){ showErr('<strong>Error de conexión.</strong> Revisa tu internet e inténtalo otra vez.'); }
    setTimeout(() => $('lgBtn').disabled = false, 700);
  });
})();
</script>
</body>
</html>
